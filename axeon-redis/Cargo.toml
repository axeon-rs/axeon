[package]
name = "axeon-redis"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Redis integrations for Axeon: a shared session store"
license = "MIT"
repository = "https://github.com/axeon-rs/axeon"
documentation = "https://docs.rs/axeon-redis"
readme = "README.md"
keywords = ["redis", "sessions", "axeon", "web"]
categories = ["web-programming", "database"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
axeon = { version = "1.1", path = "..", default-features = false, features = ["cookies"] }
redis = { version = "1.7", default-features = false, features = ["tokio-comp", "connection-manager"] }
serde_json = "1"
sha2 = "0.10"
futures = { version = "0.3.31", default-features = false, features = ["std"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[features]
# `rediss://` URLs (TLS with rustls), as managed Redis services require.
tls = ["redis/tokio-rustls-comp", "redis/tls-rustls-webpki-roots"]
