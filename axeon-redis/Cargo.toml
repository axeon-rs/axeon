[package]
name = "axeon-redis"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Redis integrations for Axeon: shared sessions, rate limits, idempotency keys and broadcast"
license = "MIT"
repository = "https://github.com/axeon-rs/axeon"
documentation = "https://docs.rs/axeon-redis"
readme = "README.md"
keywords = ["redis", "sessions", "rate-limit", "axeon", "web"]
categories = ["web-programming", "database"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
axeon = { version = "1.2", path = "..", default-features = false, features = ["cookies", "idempotency"] }
redis = { version = "1.7", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
serde_json = "1"
sha2 = "0.10"
futures = { version = "0.3.31", default-features = false, features = ["std"] }
tracing = "0.1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[features]
# `rediss://` URLs (TLS with rustls), as managed Redis services require.
# Uses the aws-lc-rs crypto provider, like the rest of the Axeon crates.
tls = ["redis/tokio-rustls-comp", "redis/tls-rustls-webpki-roots", "dep:rustls"]
