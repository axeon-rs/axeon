[package]
name = "framework-benchmarks"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axeon = { path = "../..", default-features = false }
axum = "0.8"
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
codegen-units = 1
lto = "fat"

