name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  features:
    name: Features (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - --no-default-features
          - --no-default-features --features tls
          - --no-default-features --features compression
          - --no-default-features --features ws
          - --no-default-features --features multipart
          - --no-default-features --features cookies
          - --no-default-features --features jwt
          - --no-default-features --features templates
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}
      - run: cargo test ${{ matrix.features }}

  workspace:
    name: All crates together
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Feature unification only shows up when every crate is built at once:
      # one crate can switch on a dependency feature that breaks another.
      - run: cargo test --workspace --all-features
      # Every crate must use rustls' aws-lc-rs provider. Two providers in one
      # app make `ClientConfig::builder()` panic in crates that call it.
      - name: Only one rustls crypto provider
        run: |
          if cargo tree -i ring --workspace --all-features -e normal --target all 2>/dev/null | grep -q ring; then
            cargo tree -i ring --workspace --all-features -e normal --target all
            echo "ring is a normal dependency again; use the aws-lc-rs rustls provider" >&2
            exit 1
          fi

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p axeon --all-features
      - uses: dtolnay/rust-toolchain@1.94
      - run: cargo check -p axeon-orm -p axeon-orm-cli --all-features --all-targets

  lint:
    name: Clippy and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features
      - run: cargo clippy --all-targets --no-default-features
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo bench --no-run

  orm:
    name: axeon-orm (SQLite, PostgreSQL and MySQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: axeon
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -pmysql" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      AXEON_ORM_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
      AXEON_ORM_MYSQL_URL: mysql://root:mysql@localhost:3306/axeon
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p axeon-orm -p axeon-orm-macros -p axeon-orm-cli --all-features
      - run: cargo check -p axeon-orm --no-default-features --features sqlite --all-targets
      - run: cargo check -p axeon-orm --no-default-features --features postgres --all-targets
      - run: cargo check -p axeon-orm --no-default-features --features mysql --all-targets
      - run: cargo clippy -p axeon-orm -p axeon-orm-macros -p axeon-orm-cli --all-targets --all-features
      - run: cargo doc -p axeon-orm -p axeon-orm-cli --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  example-app:
    name: Example app (todo-api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/todo-api
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/todo-api
      - run: cargo test
