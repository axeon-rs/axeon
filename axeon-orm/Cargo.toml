[package]
name = "axeon-orm"
version = "0.3.0"
edition = "2021"
rust-version = "1.94"
description = "An Eloquent-style ORM for Rust on top of sqlx, with first-class Axeon integration"
license = "MIT"
repository = "https://github.com/axeon-rs/axeon"
documentation = "https://docs.rs/axeon-orm"
readme = "README.md"
exclude = ["docker-compose.yml"]
keywords = ["orm", "database", "sqlx", "postgres", "sqlite"]
categories = ["database", "web-programming"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
axeon-orm-macros = { version = "0.3.0", path = "../axeon-orm-macros" }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio"] }
futures = { version = "0.3.31", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"], optional = true }
uuid = { version = "1", optional = true }
serde_json = "1"
base64 = "0.23"
axeon = { version = "1.1", path = "..", default-features = false, features = ["idempotency"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
serde_json = "1"

[features]
default = ["postgres", "sqlite", "tls", "chrono", "json", "axeon"]
# Database backends; enable at least one.
postgres = ["sqlx/postgres"]
sqlite = ["sqlx/sqlite"]
mysql = ["sqlx/mysql"]
# Encrypted connections to PostgreSQL and MySQL (rustls with webpki roots).
# Needed for most managed databases, and for MySQL 8's default login method.
# Uses the aws-lc-rs crypto provider, like Axeon and axeon-client, so an app
# that combines them compiles in only one rustls provider.
tls = ["sqlx/tls-rustls-aws-lc-rs"]
# Column types.
chrono = ["dep:chrono", "sqlx/chrono"]
uuid = ["dep:uuid", "sqlx/uuid"]
json = ["sqlx/json"]
# pgvector `vector` columns, distances and indexes (PostgreSQL).
pgvector = ["postgres"]
# Test helpers (`axeon_orm::testing`): isolated test databases, rolled-back
# transactions and model factories. For `[dev-dependencies]`.
testing = ["tokio/rt"]
# `req.db()`, the `Transactional` and `TenantScope` middleware, error
# conversion, and (with `postgres`) broadcast and idempotency stores for Axeon.
axeon = ["dep:axeon"]
