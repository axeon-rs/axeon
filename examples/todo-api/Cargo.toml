[package]
name = "todo-api"
version = "0.1.0"
edition = "2021"
publish = false
description = "A complete REST API built with Axeon: SQLite, JWT auth, validation, metrics."

[dependencies]
axeon = { path = "../.." }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# Its own workspace: building Axeon doesn't build this example.
[workspace]
