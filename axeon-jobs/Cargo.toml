[package]
name = "axeon-jobs"
version = "0.2.0"
edition = "2021"
rust-version = "1.94"
description = "Background jobs on PostgreSQL for Axeon: retries, delays, unique jobs and graceful shutdown"
license = "MIT"
repository = "https://github.com/axeon-rs/axeon"
documentation = "https://docs.rs/axeon-jobs"
readme = "README.md"
keywords = ["jobs", "queue", "background", "postgres", "axeon"]
categories = ["asynchronous", "database", "web-programming"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
axeon-orm = { version = "0.4.0", path = "../axeon-orm", default-features = false, features = ["postgres", "json", "chrono"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "json", "chrono", "runtime-tokio", "derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
futures = { version = "0.3.31", default-features = false, features = ["std"] }
tracing = "0.1"
axeon = { version = "1.2", path = "..", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
axeon-orm = { version = "0.4.0", path = "../axeon-orm", default-features = false, features = ["postgres", "sqlite", "json", "chrono"] }

[features]
default = ["metrics"]
# `Worker::metrics`: job counters and durations on an Axeon `Metrics` registry.
metrics = ["dep:axeon"]
